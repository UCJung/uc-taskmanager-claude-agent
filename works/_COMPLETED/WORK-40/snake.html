<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: #4ecca3;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #score-board {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
      font-size: 1rem;
    }

    .score-item span {
      font-size: 1.4rem;
      font-weight: bold;
      color: #4ecca3;
    }

    #game-container {
      position: relative;
    }

    canvas {
      display: block;
      border: 2px solid #4ecca3;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    #overlay h2 {
      font-size: 2rem;
      color: #e94560;
      margin-bottom: 12px;
    }

    #overlay .final-score {
      font-size: 1.2rem;
      color: #ccc;
      margin-bottom: 24px;
    }

    #restart-btn {
      padding: 12px 32px;
      font-size: 1rem;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
      transition: background 0.2s, transform 0.1s;
    }

    #restart-btn:hover {
      background: #38b08a;
    }

    #restart-btn:active {
      transform: scale(0.97);
    }

    #hint {
      margin-top: 14px;
      font-size: 0.82rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>

  <div id="score-board">
    <div class="score-item">점수: <span id="score">0</span></div>
    <div class="score-item">최고: <span id="high-score">0</span></div>
  </div>

  <div id="game-container">
    <canvas id="game-canvas" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">Snake Game</h2>
      <div class="final-score" id="overlay-msg">방향키로 시작하세요</div>
      <button id="restart-btn">시작</button>
    </div>
  </div>

  <div id="hint">방향키(↑ ↓ ← →)로 조작 &nbsp;|&nbsp; 스페이스로 일시정지</div>

  <script>
    // ── 상수 ──────────────────────────────────────────────
    const CANVAS_SIZE = 400;
    const CELL = 20;                        // 한 칸 픽셀 크기
    const COLS = CANVAS_SIZE / CELL;        // 20칸
    const ROWS = CANVAS_SIZE / CELL;        // 20칸
    const BASE_INTERVAL = 150;             // ms, 초기 이동 속도
    const MIN_INTERVAL  = 60;              // ms, 최고 속도

    const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
    const DELTA = [
      { x: 0, y: -1 },  // UP
      { x: 1, y: 0  },  // RIGHT
      { x: 0, y: 1  },  // DOWN
      { x: -1, y: 0 },  // LEFT
    ];

    // ── 상태 ──────────────────────────────────────────────
    let snake, dir, nextDir, food, score, highScore, gameState, loopId;
    // gameState: 'idle' | 'running' | 'paused' | 'over'

    const canvas    = document.getElementById('game-canvas');
    const ctx       = canvas.getContext('2d');
    const overlay   = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg   = document.getElementById('overlay-msg');
    const restartBtn   = document.getElementById('restart-btn');
    const scoreEl   = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');

    highScore = parseInt(localStorage.getItem('snake_hs') || '0', 10);
    highScoreEl.textContent = highScore;

    // ── 게임 초기화 ────────────────────────────────────────
    function init() {
      snake   = [{ x: 10, y: 10 }];
      dir     = DIR.RIGHT;
      nextDir = DIR.RIGHT;
      score   = 0;
      scoreEl.textContent = '0';
      placeFood();
    }

    function placeFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS),
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    // ── 게임 루프 ──────────────────────────────────────────
    function getInterval() {
      // 점수 10점마다 10ms 빨라짐
      return Math.max(MIN_INTERVAL, BASE_INTERVAL - Math.floor(score / 10) * 10);
    }

    function scheduleNext() {
      loopId = setTimeout(tick, getInterval());
    }

    function tick() {
      if (gameState !== 'running') return;
      dir = nextDir;

      const head = {
        x: snake[0].x + DELTA[dir].x,
        y: snake[0].y + DELTA[dir].y,
      };

      // 벽 충돌
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        endGame(); return;
      }
      // 자기 몸 충돌 (꼬리 제외 — 꼬리는 이번 틱에 사라짐)
      if (snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y)) {
        endGame(); return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snake_hs', highScore);
        }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
      scheduleNext();
    }

    // ── 렌더링 ─────────────────────────────────────────────
    function draw() {
      // 배경
      ctx.fillStyle = '#0f0f23';
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      // 격자 (옵션, 연하게)
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, CANVAS_SIZE);
        ctx.stroke();
      }
      for (let j = 0; j <= ROWS; j++) {
        ctx.beginPath();
        ctx.moveTo(0, j * CELL);
        ctx.lineTo(CANVAS_SIZE, j * CELL);
        ctx.stroke();
      }

      // 먹이
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(fx, fy, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // 뱀
      snake.forEach((seg, i) => {
        const brightness = i === 0 ? 1 : 1 - (i / snake.length) * 0.5;
        ctx.fillStyle = i === 0
          ? '#4ecca3'
          : `rgba(78, 204, 163, ${brightness})`;
        const padding = i === 0 ? 1 : 2;
        ctx.beginPath();
        ctx.roundRect(
          seg.x * CELL + padding,
          seg.y * CELL + padding,
          CELL - padding * 2,
          CELL - padding * 2,
          i === 0 ? 4 : 3
        );
        ctx.fill();
      });

      // 머리 눈
      drawEyes();
    }

    function drawEyes() {
      const head = snake[0];
      const cx = head.x * CELL + CELL / 2;
      const cy = head.y * CELL + CELL / 2;
      const eyeOffset = 4;
      const eyeR = 2;

      let e1, e2;
      switch (dir) {
        case DIR.UP:    e1 = { x: cx - eyeOffset, y: cy - 3 }; e2 = { x: cx + eyeOffset, y: cy - 3 }; break;
        case DIR.DOWN:  e1 = { x: cx - eyeOffset, y: cy + 3 }; e2 = { x: cx + eyeOffset, y: cy + 3 }; break;
        case DIR.LEFT:  e1 = { x: cx - 3, y: cy - eyeOffset }; e2 = { x: cx - 3, y: cy + eyeOffset }; break;
        case DIR.RIGHT: e1 = { x: cx + 3, y: cy - eyeOffset }; e2 = { x: cx + 3, y: cy + eyeOffset }; break;
      }
      ctx.fillStyle = '#1a1a2e';
      [e1, e2].forEach(e => {
        ctx.beginPath();
        ctx.arc(e.x, e.y, eyeR, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // ── 게임 종료 ──────────────────────────────────────────
    function endGame() {
      gameState = 'over';
      clearTimeout(loopId);
      draw(); // 마지막 프레임 유지
      overlayTitle.textContent = 'Game Over';
      overlayMsg.textContent   = `최종 점수: ${score}점`;
      restartBtn.textContent   = '다시 시작';
      overlay.style.display = 'flex';
    }

    // ── 게임 시작 ──────────────────────────────────────────
    function startGame() {
      overlay.style.display = 'none';
      init();
      gameState = 'running';
      draw();
      scheduleNext();
    }

    // ── 일시정지 ───────────────────────────────────────────
    function togglePause() {
      if (gameState === 'running') {
        gameState = 'paused';
        clearTimeout(loopId);
        overlayTitle.textContent = '일시정지';
        overlayMsg.textContent   = `현재 점수: ${score}점`;
        restartBtn.textContent   = '계속하기';
        overlay.style.display = 'flex';
      } else if (gameState === 'paused') {
        overlay.style.display = 'none';
        gameState = 'running';
        scheduleNext();
      }
    }

    // ── 입력 처리 ──────────────────────────────────────────
    const KEY_DIR = {
      ArrowUp:    DIR.UP,
      ArrowDown:  DIR.DOWN,
      ArrowLeft:  DIR.LEFT,
      ArrowRight: DIR.RIGHT,
      w: DIR.UP, W: DIR.UP,
      s: DIR.DOWN, S: DIR.DOWN,
      a: DIR.LEFT, A: DIR.LEFT,
      d: DIR.RIGHT, D: DIR.RIGHT,
    };
    const OPPOSITE = [DIR.DOWN, DIR.LEFT, DIR.UP, DIR.RIGHT];

    document.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'Escape') {
        e.preventDefault();
        if (gameState === 'idle' || gameState === 'over') {
          startGame();
        } else {
          togglePause();
        }
        return;
      }

      if (KEY_DIR[e.key] !== undefined) {
        e.preventDefault();
        const desired = KEY_DIR[e.key];
        // idle/over → 게임 시작
        if (gameState === 'idle' || gameState === 'over') {
          startGame();
          nextDir = desired;
          return;
        }
        // 반대 방향 금지
        if (desired !== OPPOSITE[dir]) {
          nextDir = desired;
        }
        // 일시정지 중이면 재개
        if (gameState === 'paused') togglePause();
      }
    });

    restartBtn.addEventListener('click', startGame);

    // ── 초기 화면 그리기 ───────────────────────────────────
    (function drawIdle() {
      gameState = 'idle';
      ctx.fillStyle = '#0f0f23';
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      overlay.style.display = 'flex';
    })();
  </script>
</body>
</html>
