<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 16px;
      color: #4ecca3;
      text-shadow: 0 0 20px rgba(78, 204, 163, 0.5);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #score-board {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
    }

    .score-item {
      text-align: center;
    }

    .score-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #888;
    }

    .score-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #4ecca3;
    }

    #game-container {
      position: relative;
      border: 2px solid #4ecca3;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(78, 204, 163, 0.3);
    }

    canvas {
      display: block;
      background-color: #16213e;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(22, 33, 62, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
    }

    #overlay h2 {
      font-size: 2rem;
      color: #e94560;
      margin-bottom: 12px;
      text-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
    }

    #overlay p {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 8px;
    }

    #final-score {
      font-size: 1.4rem;
      color: #4ecca3;
      margin-bottom: 24px;
    }

    #restart-btn {
      padding: 12px 32px;
      font-size: 1rem;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background 0.2s, transform 0.1s;
    }

    #restart-btn:hover {
      background: #38b48b;
      transform: scale(1.05);
    }

    #restart-btn:active {
      transform: scale(0.97);
    }

    #instructions {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #555;
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>

  <div id="score-board">
    <div class="score-item">
      <div class="score-label">점수</div>
      <div class="score-value" id="score-display">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">최고 점수</div>
      <div class="score-value" id="best-display">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">레벨</div>
      <div class="score-value" id="level-display">1</div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">Snake Game</h2>
      <p id="overlay-message">방향키로 뱀을 조종하세요</p>
      <p id="final-score"></p>
      <button id="restart-btn">시작하기</button>
    </div>
  </div>

  <div id="instructions">
    방향키 (↑ ↓ ← →) 또는 WASD 로 조작 &nbsp;|&nbsp; 먹이를 먹으면 점수 +10
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMessage = document.getElementById('overlay-message');
    const finalScoreEl = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');
    const scoreDisplay = document.getElementById('score-display');
    const bestDisplay = document.getElementById('best-display');
    const levelDisplay = document.getElementById('level-display');

    // 게임 상수
    const CELL = 20;                       // 셀 크기 (px)
    const COLS = canvas.width / CELL;      // 열 수 = 20
    const ROWS = canvas.height / CELL;     // 행 수 = 20
    const BASE_SPEED = 150;               // 초기 이동 간격 (ms)
    const SPEED_STEP = 5;                  // 레벨 당 속도 감소 (ms)
    const POINTS_PER_FOOD = 10;
    const LEVEL_UP_SCORE = 50;            // 50점마다 레벨업

    // 색상
    const COLORS = {
      snakeHead: '#4ecca3',
      snakeBody: '#38b48b',
      snakeOutline: '#2a8a6a',
      food: '#e94560',
      foodGlow: 'rgba(233,69,96,0.4)',
      grid: 'rgba(255,255,255,0.03)',
    };

    // 방향 벡터
    const DIR = {
      UP:    { x: 0,  y: -1 },
      DOWN:  { x: 0,  y:  1 },
      LEFT:  { x: -1, y:  0 },
      RIGHT: { x: 1,  y:  0 },
    };

    // 반대 방향 맵 (180도 전환 방지)
    const OPPOSITE = {
      UP: 'DOWN', DOWN: 'UP', LEFT: 'RIGHT', RIGHT: 'LEFT',
    };

    // 게임 상태
    let snake, direction, nextDir, food, score, bestScore, level, gameLoop, running;

    bestScore = parseInt(localStorage.getItem('snakeBest') || '0', 10);
    bestDisplay.textContent = bestScore;

    function initGame() {
      // 뱀 초기화 — 가운데에서 3칸 길이로 시작
      const startX = Math.floor(COLS / 2);
      const startY = Math.floor(ROWS / 2);
      snake = [
        { x: startX,     y: startY },
        { x: startX - 1, y: startY },
        { x: startX - 2, y: startY },
      ];
      direction = 'RIGHT';
      nextDir = 'RIGHT';
      score = 0;
      level = 1;
      running = true;
      scoreDisplay.textContent = '0';
      levelDisplay.textContent = '1';
      spawnFood();
    }

    function spawnFood() {
      let pos;
      // 뱀 위치와 겹치지 않는 위치 선택
      do {
        pos = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS),
        };
      } while (snake.some(seg => seg.x === pos.x && seg.y === pos.y));
      food = pos;
    }

    function getSpeed() {
      return Math.max(60, BASE_SPEED - (level - 1) * SPEED_STEP);
    }

    function startLoop() {
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, getSpeed());
    }

    function tick() {
      if (!running) return;

      // 방향 확정 (큐에서 꺼내기)
      direction = nextDir;

      // 새 머리 위치
      const head = snake[0];
      const d = DIR[direction];
      const newHead = { x: head.x + d.x, y: head.y + d.y };

      // 벽 충돌 검사
      if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
        gameOver();
        return;
      }

      // 자기 몸 충돌 검사
      if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
        gameOver();
        return;
      }

      // 뱀 이동 — 앞에 추가
      snake.unshift(newHead);

      // 먹이 먹기
      if (newHead.x === food.x && newHead.y === food.y) {
        score += POINTS_PER_FOOD;
        scoreDisplay.textContent = score;

        // 최고 점수 갱신
        if (score > bestScore) {
          bestScore = score;
          bestDisplay.textContent = bestScore;
          localStorage.setItem('snakeBest', bestScore);
        }

        // 레벨업 체크
        const newLevel = Math.floor(score / LEVEL_UP_SCORE) + 1;
        if (newLevel > level) {
          level = newLevel;
          levelDisplay.textContent = level;
          startLoop(); // 속도 갱신
        }

        spawnFood();
        // 꼬리 제거 안 함 → 길이 증가
      } else {
        snake.pop(); // 꼬리 제거 → 길이 유지
      }

      draw();
    }

    function draw() {
      // 배경 초기화
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 격자 그리기
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * CELL, 0);
        ctx.lineTo(x * CELL, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * CELL);
        ctx.lineTo(canvas.width, y * CELL);
        ctx.stroke();
      }

      // 먹이 그리기 (발광 효과)
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      const glow = ctx.createRadialGradient(fx, fy, 1, fx, fy, CELL);
      glow.addColorStop(0, COLORS.food);
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(fx, fy, CELL, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = COLORS.food;
      ctx.beginPath();
      ctx.arc(fx, fy, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // 뱀 그리기
      snake.forEach((seg, i) => {
        const x = seg.x * CELL;
        const y = seg.y * CELL;
        const pad = 1;

        if (i === 0) {
          // 머리
          ctx.fillStyle = COLORS.snakeHead;
          ctx.strokeStyle = COLORS.snakeOutline;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, 4);
          ctx.fill();
          ctx.stroke();

          // 눈
          drawEyes(seg, direction);
        } else {
          // 몸통 — 꼬리 쪽으로 갈수록 약간 어둡게
          const ratio = i / snake.length;
          ctx.fillStyle = interpolateColor('#38b48b', '#1a5c46', ratio);
          ctx.strokeStyle = COLORS.snakeOutline;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, 3);
          ctx.fill();
          ctx.stroke();
        }
      });
    }

    function drawEyes(seg, dir) {
      const cx = seg.x * CELL + CELL / 2;
      const cy = seg.y * CELL + CELL / 2;
      const eyeOffset = 3.5;
      const eyeRadius = 2;
      const pupilRadius = 1.2;

      let eye1, eye2;
      switch (dir) {
        case 'RIGHT': eye1 = { x: cx + 4, y: cy - eyeOffset }; eye2 = { x: cx + 4, y: cy + eyeOffset }; break;
        case 'LEFT':  eye1 = { x: cx - 4, y: cy - eyeOffset }; eye2 = { x: cx - 4, y: cy + eyeOffset }; break;
        case 'UP':    eye1 = { x: cx - eyeOffset, y: cy - 4 }; eye2 = { x: cx + eyeOffset, y: cy - 4 }; break;
        case 'DOWN':  eye1 = { x: cx - eyeOffset, y: cy + 4 }; eye2 = { x: cx + eyeOffset, y: cy + 4 }; break;
      }

      [eye1, eye2].forEach(e => {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(e.x, e.y, eyeRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath();
        ctx.arc(e.x, e.y, pupilRadius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function interpolateColor(hex1, hex2, t) {
      const r1 = parseInt(hex1.slice(1, 3), 16);
      const g1 = parseInt(hex1.slice(3, 5), 16);
      const b1 = parseInt(hex1.slice(5, 7), 16);
      const r2 = parseInt(hex2.slice(1, 3), 16);
      const g2 = parseInt(hex2.slice(3, 5), 16);
      const b2 = parseInt(hex2.slice(5, 7), 16);
      const r = Math.round(r1 + (r2 - r1) * t);
      const g = Math.round(g1 + (g2 - g1) * t);
      const b = Math.round(b1 + (b2 - b1) * t);
      return `rgb(${r},${g},${b})`;
    }

    function gameOver() {
      running = false;
      clearInterval(gameLoop);
      overlayTitle.textContent = 'Game Over';
      overlayTitle.style.color = '#e94560';
      overlayMessage.textContent = '최종 점수';
      finalScoreEl.textContent = score + '점';
      restartBtn.textContent = '다시 시작';
      overlay.style.display = 'flex';
    }

    function startGame() {
      overlay.style.display = 'none';
      initGame();
      draw();
      startLoop();
    }

    // 키보드 입력
    document.addEventListener('keydown', (e) => {
      const map = {
        ArrowUp:    'UP',
        ArrowDown:  'DOWN',
        ArrowLeft:  'LEFT',
        ArrowRight: 'RIGHT',
        w: 'UP', W: 'UP',
        s: 'DOWN', S: 'DOWN',
        a: 'LEFT', A: 'LEFT',
        d: 'RIGHT', D: 'RIGHT',
      };

      const newDir = map[e.key];
      if (!newDir) return;

      // 방향키 기본 동작(스크롤) 방지
      e.preventDefault();

      // 게임 중이 아닐 때 스페이스/엔터로 시작
      if (!running) return;

      // 180도 반전 방지
      if (OPPOSITE[direction] !== newDir) {
        nextDir = newDir;
      }
    });

    // 스페이스/엔터로 시작 또는 재시작
    document.addEventListener('keydown', (e) => {
      if ((e.key === ' ' || e.key === 'Enter') && overlay.style.display !== 'none') {
        e.preventDefault();
        startGame();
      }
    });

    restartBtn.addEventListener('click', startGame);

    // 초기 최고 점수 표시
    bestDisplay.textContent = bestScore;
  </script>
</body>
</html>
